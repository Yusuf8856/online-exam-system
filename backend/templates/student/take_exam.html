{% extends 'base.html' %} {% block title %}Taking Exam: 
{{ exam.name }}{% endblock %} {% block content %}
<div class="container mt-4">
  <div class="card shadow-lg">
    <div
      class="card-header bg-primary text-white d-flex justify-content-between align-items-center"
    >
      <h3 class="mb-0">{{ exam.name }}</h3>
      <div id="timer" class="fs-4 fw-bold">--:--</div>
    </div>
    <div class="card-body">
      <form method="post" id="exam-form">
        {% csrf_token %} {% for question in questions %}
        <div class="card mb-4">
          <div class="card-header">
            <strong>Question {{ forloop.counter }}</strong> ({{ question.marks
            }} marks)
          </div>
          <div class="card-body">
            <p class="card-text">{{ question.text }}</p>
            <div class="ms-3">
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="radio"
                  name="question_{{ question.id }}"
                  id="q{{ question.id }}o1"
                  value="{{ question.option1 }}"
                />
                <label class="form-check-label" for="q{{ question.id }}o1"
                  >{{ question.option1 }}</label
                >
              </div>
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="radio"
                  name="question_{{ question.id }}"
                  id="q{{ question.id }}o2"
                  value="{{ question.option2 }}"
                />
                <label class="form-check-label" for="q{{ question.id }}o2"
                  >{{ question.option2 }}</label
                >
              </div>
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="radio"
                  name="question_{{ question.id }}"
                  id="q{{ question.id }}o3"
                  value="{{ question.option3 }}"
                />
                <label class="form-check-label" for="q{{ question.id }}o3"
                  >{{ question.option3 }}</label
                >
              </div>
              <div class="form-check mb-2">
                <input
                  class="form-check-input"
                  type="radio"
                  name="question_{{ question.id }}"
                  id="q{{ question.id }}o4"
                  value="{{ question.option4 }}"
                />
                <label class="form-check-label" for="q{{ question.id }}o4"
                  >{{ question.option4 }}</label
                >
              </div>
            </div>
          </div>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-success btn-lg w-100">
          Submit Exam
        </button>
      </form>
    </div>
  </div>
</div>

<script>
  const duration = {{ exam.duration }} * 60;
  const timerDisplay = document.getElementById('timer');
  let timer = duration, minutes, seconds;

  setInterval(function () {
      minutes = parseInt(timer / 60, 10);
      seconds = parseInt(timer % 60, 10);

      minutes = minutes < 10 ? "0" + minutes : minutes;
      seconds = seconds < 10 ? "0" + seconds : seconds;

      timerDisplay.textContent = minutes + ":" + seconds;

      if (--timer < 0) {
          document.getElementById('exam-form').submit();
      }
  }, 1000);
</script>
{% endblock %}
