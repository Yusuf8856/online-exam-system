<!DOCTYPE html>
<html>

    <head>
        {% load static %}

        <!-- Page Title -->
        <title>Online Examination System - Register</title>

        <!-- Linking CSS file -->
        <link rel="stylesheet" href="{% static 'css/style.css' %}">

    </head>


    <body>

        <!-- Wrapper used to center the card on screen -->
        <div class="wrapper">


            <!-- Register Card -->
            <div class="login-card">

                <!-- Page Heading -->
                <h1>Create Account</h1>

                <!-- Small subtitle -->
                <p class="subtitle">
                    Register to access the Online Examination System
                </p>


                <!-- Registration Form -->
                <form id="signupForm">


                    <!-- Full Name -->
                    <div class="form-group">

                        <label>Full Name</label>

                        <input
                            type="text"
                            placeholder="Enter your name"
                            required
                        >

                    </div>



                    <!-- Email Address -->
                    <div class="form-group">

                        <label>Email Address</label>

                        <input
                            type="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>



                    <!-- Password -->
                    <div class="form-group">

                        <label>Password</label>

                        <input
                            type="password"
                            placeholder="Create password"
                            required
                        >

                    </div>



                    <!-- Confirm Password -->
                    <div class="form-group">

                        <label>Confirm Password</label>

                        <input
                            type="password"
                            placeholder="Confirm password"
                            required
                        >

                    </div>



                    <!-- Phone Number -->
                    <div class="form-group">

                        <label>Phone Number</label>

                        <input
                            type="text"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>



                    <!-- Role Selection -->
                    <div class="form-group">

                        <label>Select Role</label>

                        <select required>

                            <option value="">
                                Choose Role
                            </option>

                            <option value="student">
                                Student
                            </option>

                            <option value="teacher">
                                Teacher
                            </option>

                        </select>

                    </div>



                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="login-btn">
                        Register
                    </button>



                </form>


                <!-- Login Link -->
                <p class="register-text">

                    Already have an account ?

                    <a href="{% url 'login' %}">
                        Login
                    </a>

                </p>


            </div>

        </div>


        <!-- JavaScript File -->
        <script src="{% static 'js/main.js' %}"></script>

    </body>

</html>
