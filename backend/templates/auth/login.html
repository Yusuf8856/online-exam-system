{% extends 'base.html' %} {% block title %}Login | Online Examination System{% endblock %} {% block content %}
<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <div class="card shadow-lg border-0 rounded-lg">
        <div class="card-body p-0">
          <div class="row">
            <div
              class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-primary rounded-start"
            >
              <div class="text-center p-5">
                <i class="fas fa-user-lock fa-5x text-white mb-4"></i>
                <h2 class="text-white fw-bold">Secure Login</h2>
                <p class="text-white-50">
                  Welcome back! Please login to access your dashboard.
                </p>
              </div>
            </div>
            <div class="col-lg-6 p-5">
              <h3 class="fw-bold text-center mb-4">Login to Your Account</h3>
              <form method="POST">
                {% csrf_token %}
                <div class="form-floating mb-3">
                  <input
                    type="text"
                    name="username"
                    class="form-control"
                    id="floatingUsername"
                    placeholder="Enter username"
                    required
                  />
                  <label for="floatingUsername">Username</label>
                </div>
                <div class="form-floating mb-3">
                  <input
                    type="password"
                    name="password"
                    class="form-control"
                    id="floatingPassword"
                    placeholder="Enter password"
                    required
                  />
                  <label for="floatingPassword">Password</label>
                </div>
                <div class="form-floating mb-3">
                  <select name="role" class="form-select" id="floatingRole" required>
                    <option value="" selected disabled>Select Role</option>
                    <option value="admin">Admin</option>
                    <option value="teacher">Teacher</option>
                    <option value="student">Student</option>
                  </select>
                  <label for="floatingRole">Role</label>
                </div>
                <div class="d-grid">
                  <button type="submit" class="btn btn-primary btn-lg">
                    <i class="fas fa-sign-in-alt me-2"></i>Login
                  </button>
                </div>
              </form>
              <hr class="my-4" />
              <div class="text-center">
                <p class="small">
                  Don't have an account?
                  <a href="{% url 'register' %}">Register Now</a>
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
