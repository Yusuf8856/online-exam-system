{% extends 'base.html' %} {% block title %}Settings | Admin Panel
{% endblock %}
{% block content %}
<div class="row">
  <div class="col-md-3 col-lg-2 mb-4">
    <div class="list-group shadow-sm">
      <a
        href="{% url 'admin_dashboard' %}"
        class="list-group-item list-group-item-action"
        >Dashboard</a
      >
      <a
        href="{% url 'manage_teachers' %}"
        class="list-group-item list-group-item-action"
        >Manage Teachers</a
      >
      <a
        href="{% url 'manage_students' %}"
        class="list-group-item list-group-item-action"
        >Manage Students</a
      >
      <a
        href="{% url 'manage_exams' %}"
        class="list-group-item list-group-item-action"
        >Manage Exams</a
      >
      <a
        href="{% url 'question_bank' %}"
        class="list-group-item list-group-item-action"
        >Question Bank</a
      >
      <a
        href="{% url 'view_results' %}"
        class="list-group-item list-group-item-action"
        >View Results</a
      >
      <a
        href="{% url 'admin_settings' %}"
        class="list-group-item list-group-item-action active bg-primary border-primary"
        >Settings</a
      >
      <a
        href="{% url 'logout' %}"
        class="list-group-item list-group-item-action text-danger"
        >Logout</a
      >
    </div>
  </div>
  <div class="col-md-9 col-lg-10">
    <h2>System Settings</h2>
    <div class="alert alert-warning mt-3">
      System configuration settings will be available here.
    </div>
  </div>
</div>
{% endblock %}
