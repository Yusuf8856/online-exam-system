services:
  - type: web
    name: online-exam-system
    runtime: python311
    buildCommand: bash build.sh
    startCommand: gunicorn backend.backend.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: digital-assessment-platform.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString

databases:
  - name: postgres-db
    databaseName: online_exam_db
    user: postgres
    plan: free
